<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Химия 8 класс</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        :root { --primary: #4A90E2; --bg: #F5F7FA; --text: #333333; --card: #FFFFFF; --success: #2ECC71; --error: #E74C3C; }
        body { font-family: -apple-system, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        .container { background-color: var(--card); border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; box-sizing: border-box; margin-bottom: 20px; }
        .header { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 15px; font-size: 14px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .question { font-size: 20px; font-weight: bold; margin: 20px 0; color: var(--primary); text-align: center; }
        .options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn { background-color: var(--bg); border: 2px solid var(--primary); color: var(--primary); padding: 15px; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn:active { transform: scale(0.95); }
        .btn.correct { background-color: var(--success); border-color: var(--success); color: white; }
        .btn.wrong { background-color: var(--error); border-color: var(--error); color: white; }
        .leaderboard-title { text-align: center; font-weight: bold; margin-bottom: 10px; color: var(--primary); }
        .leaderboard-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #eee; font-size: 14px; }
        .leaderboard-item:last-child { border-bottom: none; }
        .my-score { font-weight: bold; color: var(--primary); }
    </style>
</head>
<body>

    <div class="container" id="game-block">
        <div class="header">
            <span id="user-name">Загрузка...</span>
            <span>Очки: <span id="score">0</span></span>
        </div>
        <div style="font-size: 12px; color: #666; text-align: center;">Глава I. Знаки химических элементов</div>
        <div class="question" id="question-text">Подготовка вопросов...</div>
        <div class="options" id="options-container"></div>
    </div>

    <div class="container" id="leaderboard-block">
        <div class="leaderboard-title">Топ игроков</div>
        <div id="leaderboard-list">Загрузка рейтинга...</div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAzsKMeV8PDmz6Pt3qjF_Kc2NJAbbRJdLQ",
            authDomain: "physics8-468dd.firebaseapp.com",
            databaseURL: "https://physics8-468dd-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "physics8-468dd",
            storageBucket: "physics8-468dd.firebasestorage.app",
            messagingSenderId: "259509484645",
            appId: "1:259509484645:web:97b9d8c75ed9d297ca5a8c"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const tg = window.Telegram.WebApp;
        tg.expand();
        let user = tg.initDataUnsafe.user;
        let userId = user ? user.id : 'test_user_' + Math.floor(Math.random() * 1000);
        let userName = user ? user.first_name : 'Гость';
        let currentScore = 0;

        document.getElementById('user-name').innerText = userName;

        db.ref('users/' + userId).once('value').then((snapshot) => {
            const data = snapshot.val();
            if (data) {
                currentScore = data.score || 0;
            } else {
                saveScore(0);
            }
            document.getElementById('score').innerText = currentScore;
            generateQuestion();
        }).catch((error) => {
            document.getElementById('question-text').innerText = "Ошибка БД. Проверьте правила (Rules) в Firebase.";
        });

        function saveScore(newScore) {
            currentScore = newScore;
            document.getElementById('score').innerText = currentScore;
            db.ref('users/' + userId).set({
                name: userName,
                score: currentScore,
                timestamp: firebase.database.ServerValue.TIMESTAMP
            });
        }

        const elements = [
            { symbol: 'H', name: 'Водород' }, { symbol: 'O', name: 'Кислород' },
            { symbol: 'Na', name: 'Натрий' }, { symbol: 'Cl', name: 'Хлор' },
            { symbol: 'Fe', name: 'Железо' }, { symbol: 'C', name: 'Углерод' },
            { symbol: 'N', name: 'Азот' }, { symbol: 'Ca', name: 'Кальций' }
        ];
        let correctElement = null;

        function getRandom(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

        function generateQuestion() {
            correctElement = getRandom(elements);
            document.getElementById('question-text').innerText = `Какой символ у элемента "${correctElement.name}"?`;

            let options = [correctElement];
            while(options.length < 4) {
                let rnd = getRandom(elements);
                if(!options.includes(rnd)) options.push(rnd);
            }
            options.sort(() => Math.random() - 0.5);

            const container = document.getElementById('options-container');
            container.innerHTML = '';
            
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'btn';
                btn.innerText = opt.symbol;
                btn.onclick = () => checkAnswer(opt, btn);
                container.appendChild(btn);
            });
        }

        function checkAnswer(selected, btn) {
            const allBtns = document.querySelectorAll('.btn');
            allBtns.forEach(b => b.disabled = true);

            if(selected.symbol === correctElement.symbol) {
                btn.classList.add('correct');
                saveScore(currentScore + 10);
                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            } else {
                btn.classList.add('wrong');
                saveScore(Math.max(0, currentScore - 5));
                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
                
                allBtns.forEach(b => {
                    if(b.innerText === correctElement.symbol) b.classList.add('correct');
                });
            }
            setTimeout(generateQuestion, 1200);
        }

        db.ref('users').orderByChild('score').limitToLast(10).on('value', (snapshot) => {
            const list = document.getElementById('leaderboard-list');
            list.innerHTML = '';
            let leaders = [];
            snapshot.forEach(child => { leaders.push({id: child.key, ...child.val()}); });
            leaders.reverse();

            leaders.forEach((l, index) => {
                const div = document.createElement('div');
                div.className = 'leaderboard-item';
                if(l.id === String(userId)) div.classList.add('my-score');
                div.innerHTML = `<span>${index + 1}. ${l.name}</span> <span>${l.score}</span>`;
                list.appendChild(div);
            });
        });
    </script>
</body>
</html>
